
<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>බෝධිරාජ දහම් පාසල - ශිෂ්‍ය ලියාපදිංචිය</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px 12px;
      font-family: Arial, sans-serif;
      background: #eef5ed;
      color: #24352a;
    }

    .container {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 3px 16px rgba(0,0,0,.10);
    }

    h1 {
      text-align: center;
      color: #176b38;
      font-size: 25px;
      margin: 5px 0;
    }

    .subtitle {
      text-align: center;
      color: #52675a;
      margin: 8px 0 25px;
    }

    .field { margin-bottom: 17px; }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #b8c8bc;
      border-radius: 7px;
      font-size: 16px;
      background: white;
    }

    input:focus {
      outline: 2px solid #80b994;
      border-color: #247b45;
    }

    .voice-row {
      display: flex;
      gap: 8px;
    }

    .voice-row input { flex: 1; min-width: 0; }

    .voice-button {
      border: 0;
      border-radius: 7px;
      background: #e2f2e6;
      color: #176b38;
      padding: 0 13px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      padding: 13px 18px;
      font-size: 16px;
      font-weight: bold;
    }

    button:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .main-button {
      width: 100%;
      background: #19733d;
      color: white;
      margin-top: 12px;
    }

    .secondary-button {
      background: #e5eee7;
      color: #245b36;
      margin-top: 10px;
      width: 100%;
    }

    .message {
      display: none;
      padding: 13px;
      border-radius: 8px;
      margin: 15px 0;
      line-height: 1.6;
    }

    .error { background: #ffeded; color: #a32222; }
    .success { background: #e6f5e9; color: #176b38; }
    .info { background: #fff6dc; color: #725514; }

    .review-item {
      padding: 10px 0;
      border-bottom: 1px solid #e5eae6;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .review-item strong { color: #176b38; }

    .small-note {
      font-size: 13px;
      color: #647267;
      line-height: 1.5;
    }

    .hidden { display: none !important; }

    .footer {
      text-align: center;
      font-size: 13px;
      color: #718075;
      margin-top: 22px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>බෝධිරාජ දහම් පාසල</h1>
  <div class="subtitle">ශිෂ්‍ය ලියාපදිංචි කිරීමේ පද්ධතිය</div>

  <div id="entrySection">

    <div class="message error" id="errorMessage"></div>
    <div class="message info" id="voiceMessage" style="display:none"></div>

    <div class="field">
      <label for="fatherName">පියාගේ නම *</label>
      <div class="voice-row">
        <input id="fatherName" type="text" placeholder="පියාගේ සම්පූර්ණ නම">
        <button class="voice-button" type="button" onclick="startVoice('fatherName')">🎤 හඬ</button>
      </div>
    </div>

    <div class="field">
      <label for="motherName">මවගේ නම *</label>
      <div class="voice-row">
        <input id="motherName" type="text" placeholder="මවගේ සම්පූර්ණ නම">
        <button class="voice-button" type="button" onclick="startVoice('motherName')">🎤 හඬ</button>
      </div>
    </div>

    <div class="field">
      <label for="address">ලිපිනය *</label>
      <div class="voice-row">
        <input id="address" type="text" placeholder="ස්ථිර ලිපිනය">
        <button class="voice-button" type="button" onclick="startVoice('address')">🎤 හඬ</button>
      </div>
    </div>

    <div class="field">
      <label for="phone">WhatsApp දුරකථන අංකය</label>
      <input id="phone" type="tel" inputmode="numeric"
             maxlength="12" placeholder="07X XXX XXXX">
      <div class="small-note">දුරකථන අංකය ඇතුළත් කිරීම අනිවාර්ය නොවේ.</div>
    </div>

    <div class="field">
      <label for="childName">දරුවාගේ සම්පූර්ණ නම *</label>
      <div class="voice-row">
        <input id="childName" type="text" placeholder="දරුවාගේ සම්පූර්ණ නම">
        <button class="voice-button" type="button" onclick="startVoice('childName')">🎤 හඬ</button>
      </div>
    </div>

    <div class="field">
      <label for="school">ඉගෙනුම ලබන පාසල *</label>
      <div class="voice-row">
        <input id="school" type="text" placeholder="පාසලේ නම">
        <button class="voice-button" type="button" onclick="startVoice('school')">🎤 හඬ</button>
      </div>
    </div>

    <div class="field">
      <label for="grade">දහම් පාසල් ශ්‍රේණිය *</label>
      <input id="grade" type="text" inputmode="numeric"
             maxlength="2" placeholder="1 සිට 11 දක්වා ශ්‍රේණිය">
      <div class="small-note">1 සිට 11 දක්වා ඉලක්කම ඇතුළත් කරන්න.</div>
    </div>

    <div class="field">
      <label for="dob">උපන් දිනය *</label>
      <input id="dob" type="text" inputmode="numeric"
             maxlength="10" placeholder="YYYY/MM/DD">
      <div class="small-note">උදාහරණය: 2015/07/09</div>
    </div>

    <button class="main-button" type="button" onclick="showReview()">
      තොරතුරු පරීක්ෂා කරන්න
    </button>

    <p class="small-note">* ලකුණෙන් දක්වා ඇති තොරතුරු අනිවාර්ය වේ.</p>
  </div>

  <div id="reviewSection" class="hidden">
    <h3>ඇතුළත් කළ තොරතුරු පරීක්ෂා කරන්න</h3>
    <p class="small-note">පහත තොරතුරු නිවැරදිදැයි පරීක්ෂා කරන්න.</p>

    <div id="reviewDetails"></div>

    <button class="secondary-button" type="button" onclick="editDetails()">
      නැවත සංශෝධනය කරන්න
    </button>

    <button class="main-button" id="confirmButton" type="button"
            onclick="confirmRegistration()">
      තොරතුරු නිවැරදි බව සහතික කරමි
    </button>
  </div>

  <div id="resultSection" class="hidden">
    <div class="message success" id="resultMessage"></div>
    <button class="main-button" type="button" onclick="newRegistration()">
      තවත් දරුවෙකු ලියාපදිංචි කරන්න
    </button>
  </div>

  <div class="footer">
    බෝධිරාජ දහම් පාසල
  </div>

</div>

<iframe name="googleSheetFrame" id="googleSheetFrame"
        style="display:none"></iframe>

<form id="googleSheetForm" method="POST"
      target="googleSheetFrame"
      action="https://script.google.com/macros/s/AKfycbzKo4akOeOt06qU_Dnq0SAsi8qiCO9WW_Bw-KtCCTx7pqt6QBnJ11Ko0gIcey-aOaI9TA/exec"
      style="display:none">
  <input type="hidden" name="payload" id="payload">
</form>

<script>
  const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzKo4akOeOt06qU_Dnq0SAsi8qiCO9WW_Bw-KtCCTx7pqt6QBnJ11Ko0gIcey-aOaI9TA/exec";

  let currentData = null;
  let pendingRequestId = null;
  let responseTimer = null;
  let recognition = null;

  const fields = [
    ["fatherName", "පියාගේ නම"],
    ["motherName", "මවගේ නම"],
    ["address", "ලිපිනය"],
    ["phone", "WhatsApp දුරකථන අංකය"],
    ["childName", "දරුවාගේ නම"],
    ["school", "පාසල"],
    ["grade", "ශ්‍රේණිය"],
    ["dob", "උපන් දිනය"]
  ];

  function getFormData() {
    const data = {};
    fields.forEach(([id]) => {
      data[id] = document.getElementById(id).value.trim();
    });
    return data;
  }

  function showError(message) {
    const box = document.getElementById("errorMessage");
    box.textContent = message;
    box.style.display = "block";
    box.scrollIntoView({behavior: "smooth", block: "center"});
  }

  function hideError() {
    document.getElementById("errorMessage").style.display = "none";
  }

  function parseBirthDate(value) {
    if (!/^\d{4}\/\d{2}\/\d{2}$/.test(value)) {
      return null;
    }

    const parts = value.split("/").map(Number);
    const year = parts[0];
    const month = parts[1];
    const day = parts[2];

    const date = new Date(year, month - 1, day);
    date.setHours(0, 0, 0, 0);

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    if (
      date.getFullYear() !== year ||
      date.getMonth() !== month - 1 ||
      date.getDate() !== day ||
      year < 1900 ||
      date > today
    ) {
      return null;
    }

    return (
      String(year).padStart(4, "0") + "-" +
      String(month).padStart(2, "0") + "-" +
      String(day).padStart(2, "0")
    );
  }

  function startVoice(fieldId) {
    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      alert("මෙම බ්‍රවුසරයේ හඬ ආදාන පහසුකම නොමැත. කරුණාකර Chrome භාවිත කරන්න.");
      return;
    }

    if (recognition) {
      try { recognition.stop(); } catch (e) {}
    }

    recognition = new SpeechRecognition();
    recognition.lang = "si-LK";
    recognition.continuous = false;
    recognition.interimResults = false;

    const voiceMessage = document.getElementById("voiceMessage");
    voiceMessage.textContent = "ඔබගේ කටහඬට සවන් දෙමින් සිටී...";
    voiceMessage.style.display = "block";

    recognition.onresult = function(event) {
      const transcript = event.results[0][0].transcript;
      const input = document.getElementById(fieldId);
      input.value = input.value
        ? input.value + " " + transcript
        : transcript;
      voiceMessage.textContent = "හඬ ආදානය සාර්ථකයි.";
    };

    recognition.onerror = function(event) {
      voiceMessage.textContent =
        "හඬ ආදානයේ දෝෂයක්: " + event.error;
    };

    recognition.onend = function() {
      if (voiceMessage.textContent === "ඔබගේ කටහඬට සවන් දෙමින් සිටී...") {
        voiceMessage.textContent = "හඬ ආදානය අවසන් විය.";
      }
    };

    try {
      recognition.start();
    } catch (error) {
      voiceMessage.textContent = "මයික්‍රෆෝනය ආරම්භ කළ නොහැක.";
    }
  }
  
  // උපන් දිනයේ ඉලක්කම් අතර / ලකුණු ස්වයංක්‍රීයව එකතු කිරීම
  document.getElementById("dob").addEventListener("input", function() {
    let digits = this.value.replace(/\D/g, "").slice(0, 8);

    let formatted = digits.slice(0, 4);

    if (digits.length > 4) {
      formatted += "/" + digits.slice(4, 6);
    }

    if (digits.length > 6) {
      formatted += "/" + digits.slice(6, 8);
    }

    this.value = formatted;
  });
  
  function showReview() {
    hideError();

    const data = getFormData();

    const required = [
      ["fatherName", "පියාගේ නම"],
      ["motherName", "මවගේ නම"],
      ["address", "ලිපිනය"],
      ["childName", "දරුවාගේ නම"],
      ["school", "පාසල"],
      ["grade", "ශ්‍රේණිය"],
      ["dob", "උපන් දිනය"]
    ];

    for (const [id, label] of required) {
      if (!data[id]) {
        showError(label + " ඇතුළත් කරන්න.");
        document.getElementById(id).focus();
        return;
      }
    }

    if (!/^(?:[1-9]|1[01])$/.test(data.grade)) {
      showError("දහම් පාසල් ශ්‍රේණිය 1 සිට 11 දක්වා නිවැරදි ඉලක්කමක් විය යුතුයි.");
      document.getElementById("grade").focus();
      return;
    }

    const phone = data.phone.replace(/\s/g, "");
    if (phone && !/^\d{10}$/.test(phone)) {
      showError("දුරකථන අංකය ඉලක්කම් 10ක් විය යුතුයි.");
      document.getElementById("phone").focus();
      return;
    }

    const isoDob = parseBirthDate(data.dob);

    if (!isoDob) {
      showError("උපන් දිනය YYYY/MM/DD ආකාරයට නිවැරදිව ඇතුළත් කරන්න. උදා: 2015/07/09");
      document.getElementById("dob").focus();
      return;
    }

    currentData = {...data, isoDob: isoDob};

    const labels = {
      fatherName: "පියාගේ නම",
      motherName: "මවගේ නම",
      address: "ලිපිනය",
      phone: "WhatsApp අංකය",
      childName: "දරුවාගේ නම",
      school: "පාසල",
      grade: "දහම් පාසල් ශ්‍රේණිය",
      dob: "උපන් දිනය"
    };

    const review = document.getElementById("reviewDetails");
    review.replaceChildren();

    fields.forEach(([id]) => {
      const item = document.createElement("div");
      item.className = "review-item";

      const strong = document.createElement("strong");
      strong.textContent = labels[id] + ": ";

      const value = document.createElement("span");
      value.textContent =
        id === "grade"
          ? data[id] + " ශ්‍රේණිය"
          : (data[id] || "ඇතුළත් කර නැත");

      item.appendChild(strong);
      item.appendChild(value);
      review.appendChild(item);
    });

    document.getElementById("entrySection").classList.add("hidden");
    document.getElementById("reviewSection").classList.remove("hidden");
    document.getElementById("reviewSection").scrollIntoView({behavior: "smooth"});
  }

  function editDetails() {
    document.getElementById("reviewSection").classList.add("hidden");
    document.getElementById("entrySection").classList.remove("hidden");
    window.scrollTo({top: 0, behavior: "smooth"});
  }

  function confirmRegistration() {
    if (!currentData || pendingRequestId) return;

    if (!confirm("ඔබ ඇතුළත් කළ තොරතුරු නිවැරදි බව සහතික කර ලියාපදිංචි ඉල්ලීම ඉදිරිපත් කරනවාද?")) {
      return;
    }

    const button = document.getElementById("confirmButton");
    button.disabled = true;
    button.textContent = "තොරතුරු යවමින් පවතී...";

    pendingRequestId =
      (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : String(Date.now()) + String(Math.random()).slice(2);

    const submission = {
      fatherName: currentData.fatherName,
      motherName: currentData.motherName,
      address: currentData.address,
      phone: currentData.phone,
      childName: currentData.childName,
      school: currentData.school,
      grade: currentData.grade,
      dob: currentData.isoDob,
      requestId: pendingRequestId
    };

    document.getElementById("payload").value =
      JSON.stringify(submission);

    document.getElementById("googleSheetForm").submit();

    responseTimer = setTimeout(function() {
      if (pendingRequestId) {
        pendingRequestId = null;
        button.disabled = false;
        button.textContent = "තොරතුරු නිවැරදි බව සහතික කරමි";
        alert(
          "පද්ධතියෙන් පිළිතුරක් ලැබීමට ප්‍රමාදයි. " +
          "දත්ත සුරැකී තිබිය හැකි නිසා නැවත යැවීමට පෙර පාලක මණ්ඩලයෙන් පරීක්ෂා කරගන්න."
        );
      }
    }, 45000);
  }

  window.addEventListener("message", function(event) {
    const iframe = document.getElementById("googleSheetFrame");

    if (event.source !== iframe.contentWindow) return;
    if (!event.data || typeof event.data !== "object") return;
    if (!pendingRequestId || event.data.requestId !== pendingRequestId) return;

    clearTimeout(responseTimer);
    pendingRequestId = null;

    const button = document.getElementById("confirmButton");
    button.disabled = false;
    button.textContent = "තොරතුරු නිවැරදි බව සහතික කරමි";

    if (event.data.success) {
      document.getElementById("reviewSection").classList.add("hidden");
      document.getElementById("resultSection").classList.remove("hidden");
      document.getElementById("resultMessage").textContent =
        event.data.message ||
        "තොරතුරු සාර්ථකව ලැබුණා. පාලක මණ්ඩලයේ අනුමැතිය බලාපොරොත්තු වන්න.";
    } else {
      document.getElementById("reviewSection").classList.remove("hidden");
      alert(event.data.message || "තොරතුරු සුරැකීමේදී දෝෂයක් ඇති වුණා.");
    }
  });

  function newRegistration() {
    fields.forEach(([id]) => {
      document.getElementById(id).value = "";
    });

    currentData = null;

    document.getElementById("resultSection").classList.add("hidden");
    document.getElementById("entrySection").classList.remove("hidden");
    document.getElementById("voiceMessage").style.display = "none";
    hideError();

    window.scrollTo({top: 0, behavior: "smooth"});
  }

  document.getElementById("phone").addEventListener("input", function() {
    const digits = this.value.replace(/\D/g, "").slice(0, 10);

    let formatted = digits.slice(0, 3);

    if (digits.length > 3) {
      formatted += " " + digits.slice(3, 6);
    }

    if (digits.length > 6) {
      formatted += " " + digits.slice(6, 10);
    }

    this.value = formatted;
  });
</script>

</body>
</html>
