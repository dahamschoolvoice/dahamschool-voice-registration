
<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>සිසු ලියාපදිංචිය</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f2;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 12px #0002;
    }

    h2 {
      color: #176b3a;
    }

    p {
      line-height: 1.8;
    }

    button {
      background: #176b3a;
      color: white;
      border: none;
      padding: 13px 22px;
      margin: 8px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #10532c;
    }

    .note {
      color: #555;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>මුදුණකඩේ ශ්‍රී බෝධිරාජ දහම් පාසල</h2>

    <h3>සිසු ලියාපදිංචිය</h3>

    <p>
      ආයුබෝවන්! මුදුණකඩේ ශ්‍රී බෝධිරාජ
      දහම් පාසල් සිසුන් ලියාපදිංචි කිරීමේ
      පද්ධතිය වෙත ඔබ සාදරයෙන් පිළිගනිමු.
    </p>

    <p>
      ඔබේ දරුවා දහම් පාසලේ ලියාපදිංචි කිරීම
      සඳහා අපට අවශ්‍ය තොරතුරු දැන් ලබාදෙන්න.
    </p>

    <button onclick="startRegistration()">
      ලියාපදිංචිය ආරම්භ කරන්න
    </button>

    <p class="note">
      තොරතුරු නිවැරදිව ලබාදීමට කරුණාකර සහය වන්න.
    </p>

  </div>

  <script>
    function startRegistration() {
      alert("ලියාපදිංචි කිරීමේ කටයුතු ඉක්මනින් ආරම්භ වේ.");
    }
  </script>

</body>
</html>
